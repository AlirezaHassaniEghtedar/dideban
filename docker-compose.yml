x-app: &app
  build: .
  environment: &env
    DATABASE_URL: postgresql+psycopg2://didban:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/didban
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: didban
      POSTGRES_DB: didban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U didban"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    command: ["python","-m","app.worker"]
    environment:
      <<: *env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gpt-4.1-mini}
volumes:
  data: {}
